<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Jayakavitha</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #15151c;
            border: 1px solid #292932;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #33333d;
            border-radius: 10px;
            background: #0f0f14;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #777;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #loginMessage {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #ff7777;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            Jayakavitha
        </div>

        <p class="subtitle">
            Admin Dashboard
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Admin email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Admin password"
                    required>

            </div>


            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>


    <script src="login.js"></script>

</body>

</html>
