<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Jayakavitha</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid #292932;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        #logoutBtn {
            border: 1px solid #444;
            background: transparent;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .stats {
            margin-bottom: 30px;
        }

        .stat-card {
            background: #15151c;
            border: 1px solid #292932;
            border-radius: 15px;
            padding: 25px;
            width: 220px;
        }

        .stat-card small {
            color: #999;
        }

        .stat-card h2 {
            font-size: 35px;
            margin-top: 10px;
        }

        .message-list {
            display: grid;
            gap: 15px;
        }

        .message-card {
            background: #15151c;
            border: 1px solid #292932;
            border-radius: 15px;
            padding: 20px;
        }

        .message-card h3 {
            margin-bottom: 5px;
        }

        .email {
            color: #999;
            margin-bottom: 15px;
        }

        .message {
            color: #ddd;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .date {
            color: #777;
            font-size: 12px;
            margin-top: 15px;
        }

        .delete-btn {
            margin-top: 15px;
            padding: 8px 14px;
            border: 1px solid #555;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        .empty {
            color: #999;
            padding: 30px 0;
        }

    </style>

</head>

<body>

    <header>

        <h1>
            Jayakavitha — Admin
        </h1>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main>

        <div class="stats">

            <div class="stat-card">

                <small>
                    Total Messages
                </small>

                <h2 id="messageCount">
                    0
                </h2>

            </div>

        </div>


        <section>

            <h2>
                Messages
            </h2>

            <br>

            <div
                id="messageList"
                class="message-list">
            </div>

        </section>

    </main>


    <script src="dashboard.js"></script>

</body>

</html>
